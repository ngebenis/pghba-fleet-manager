version: '3.9'

services:

  postgres:
    image: postgres:16-alpine
    container_name: pghba-dev-db
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB:       pghba_manager
      POSTGRES_USER:     admin
      POSTGRES_PASSWORD: secret123
    volumes:
      - /home/dco/pghba-manager/pgdata-dev:/var/lib/postgresql/data
      - ./database/migrations:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U admin -d pghba_manager"]
      interval: 5s
      timeout: 5s
      retries: 10
